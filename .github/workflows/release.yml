name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release-zip:
    name: Attach rademacher.zip for HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build zip
        run: |
          cd custom_components/rademacher
          zip -r "$GITHUB_WORKSPACE/rademacher.zip" . -x '*/__pycache__/*' '*.pyc'

      - name: Upload zip to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" rademacher.zip --clobber
